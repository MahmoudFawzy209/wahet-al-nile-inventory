<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />
  
  <!-- Subtle circular glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Package / Box outline -->
  <g transform="translate(106, 106)">
    <!-- Main Box -->
    <path d="M150 15 L285 85 L285 225 L150 295 L15 225 L15 85 Z" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round" />
    
    <!-- Top Face -->
    <path d="M150 15 L285 85 L150 155 L15 85 Z" fill="url(#goldGrad)" opacity="0.9" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Center Dividing Line -->
    <path d="M150 155 L150 295" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
    
    <!-- Box Flaps / Details -->
    <path d="M82.5 50 L217.5 120" stroke="#78350f" stroke-width="8" stroke-linecap="round" />

    <!-- Yemeni Flame / Spices Icon in center -->
    <path d="M150 75 C135 110 115 130 115 155 C115 175 130 190 150 190 C170 190 185 175 185 155 C185 135 170 120 160 100 C155 115 145 120 145 130 C145 140 152 145 152 145 C152 145 140 140 140 125 C140 105 150 75 150 75 Z" fill="#fbbf24" stroke="#d97706" stroke-width="4" />
  </g>

  <!-- Arabic Typography / Badge -->
  <text x="256" y="445" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#f59e0b" text-anchor="middle" letter-spacing="1">مخزون واحة النيل</text>
</svg>
